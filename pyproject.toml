[project]
name = "portafolio"
version = "0.1.0"
description = "Portafolio personal en Flask, desplegable en Vercel"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "beautifulsoup4>=4.12.0",
    "types-beautifulsoup4>=4.12.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
e2e = [
    "playwright>=1.49.0",
    "pytest-playwright>=0.6.0",
    "axe-playwright-python>=0.1.4",
]

[tool.vercel]
entrypoint = "portafolio.wsgi:app"

[tool.vercel.scripts]
build = "python scripts/build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portafolio"]

# ---------------------------------------------------------------------------
# Principio III: la calidad la verifican las herramientas, no las opiniones.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez
    "PTH",       # flake8-use-pathlib
    "SIM",       # flake8-simplify
    "RET",       # flake8-return
    "ARG",       # flake8-unused-arguments
    "PL",        # pylint
    "RUF",       # ruff-specific
    "C90",       # mccabe: complejidad ciclomatica
    "D",         # pydocstyle: docstrings obligatorios
    "ANN",       # flake8-annotations
    "S",         # bandit: sin secretos ni patrones inseguros
]
ignore = [
    "D203",    # incompatible con D211
    "D213",    # incompatible con D212
    "D407",    # no usamos subrayado de secciones numpy
]
# Prohibido `# noqa` sin codigo de regla (Principio III).
external = []
# La raya (EN DASH) es tipografia deliberada en los rangos de fechas, no una
# errata por guion.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "PLR2004"]
"scripts/**" = ["T201"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_unreachable = true
disallow_any_generics = true
disallow_any_unimported = true
show_error_codes = true
files = ["src", "tests", "scripts"]

# `disallow_any_explicit` NO se activa: lo dispara la firma que Pydantic genera
# para cualquier BaseModel, no nuestro codigo (verificado con un modelo minimo de
# un solo campo). La constitucion prohibe el `Any` **implicito**, y de eso ya se
# encargan `strict` (disallow_untyped_defs, disallow_untyped_calls,
# warn_return_any) y `disallow_any_generics`.

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["axe_playwright_python.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: pruebas unitarias sin E/S",
    "integration: pruebas de integracion con la aplicacion",
    "contract: contrato de una ruta publica",
    "e2e: pruebas extremo a extremo con navegador",
    "perf: presupuestos de rendimiento",
]

[tool.coverage.run]
source = ["src/portafolio"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
